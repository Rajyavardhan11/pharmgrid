global
  log stdout format raw local0
defaults
  mode http
  timeout connect 3s
  timeout client 30s
  timeout server 30s
frontend http
  bind :8080
  default_backend api_pool
backend api_pool
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  server api_a api_a:8000 check inter 2000 fall 2 rise 2
  server api_b api_b:8000 check inter 2000 fall 2 rise 2
